name: Auto-increment semantic version

on:
  push:
    branches:
      - main

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Read current version
        id: read_version
        run: |
          CURRENT=$(jq -r '.version' version.json)
          echo "current_version=$CURRENT" >> $GITHUB_ENV

      - name: Calculate next version (PATCH++)
        id: bump
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$current_version"
          PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "new_version=$NEW_VERSION" >> $GITHUB_ENV

      - name: Update version.json
        run: |
          echo "{ \"version\": \"${new_version}\" }" > version.json

      - name: Commit updated version.json
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add version.json
          git commit -m "Auto-bump version to ${new_version}" || echo "No changes to commit"
          git push
